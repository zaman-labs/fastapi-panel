[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fastapi-panel"
dynamic = ["version"]
description = "An admin panel for FastAPI and SQLAlchemy. Register a model, get a secure back office."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Zaman Labs" }]
keywords = ["fastapi", "admin", "admin-panel", "sqlalchemy", "sqlmodel", "backoffice", "crud"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: AsyncIO",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.110",
    "jinja2>=3.1",
    "python-multipart>=0.0.18",
    "starlette>=0.40",
    "sqlalchemy[asyncio]>=2.0.20",
]

[project.optional-dependencies]
# Draws a QR code on the two-factor setup page. Without it, people type the key into their app.
2fa = ["qrcode>=7.4"]

[project.urls]
Homepage = "https://github.com/zaman-labs/fastapi-panel"
Documentation = "https://github.com/zaman-labs/fastapi-panel/tree/main/docs"
Changelog = "https://github.com/zaman-labs/fastapi-panel/blob/main/CHANGELOG.md"
Issues = "https://github.com/zaman-labs/fastapi-panel/issues"

[dependency-groups]
dev = [
    "aiosqlite>=0.20",
    "asyncpg>=0.32.0",
    "httpx>=0.27",
    "pytest>=8",
    "qrcode>=7.4",
    "ruff>=0.6",
    "sqlmodel>=0.0.22",
    "uvicorn>=0.30",
]

[tool.hatch.version]
path = "src/fastapi_panel/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/fastapi_panel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["S101", "S107"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "UP", "E501"]
"examples/*" = ["S"]
"scripts/*" = ["S"]
